<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理解度クイズ｜ものづくりポータル</title>
<meta name="description" content="ものづくりハンドブックの内容から、カテゴリごとに10問。答え合わせのあとに解説と、もとになったページへのリンクが出ます。">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%3E%3Crect%20width='24'%20height='24'%20rx='5'%20fill='%231f6feb'/%3E%3Crect%20x='5'%20y='6'%20width='14'%20height='3'%20rx='1'%20fill='white'/%3E%3Crect%20x='5'%20y='11'%20width='6'%20height='7'%20rx='1'%20fill='white'%20opacity='.7'/%3E%3Crect%20x='13'%20y='11'%20width='6'%20height='7'%20rx='1'%20fill='white'/%3E%3C/svg%3E">
<style>
  :root{
    --s0:#f6f7f9; --s1:#eef1f5; --s2:#ffffff;
    --tp:#1b2431; --ts:#5a6474; --tm:#8b94a3;
    --bd:#e4e8ee; --bds:#d3d9e2;
    --acc:#2563eb; --acc-t:#1d4ed8; --acc-bg:#e9f0fe;
    --ok-t:#0f6e56; --ok-bg:#e3f4ed;
    --warn-t:#9a4a16; --warn-bg:#fbeede;
    --dang-t:#a32d2d; --dang-bg:#fcecec;
    --radius:10px;
    --sans:"Noto Sans JP",-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --s0:#141821; --s1:#1b202b; --s2:#222835;
      --tp:#e8ebf1; --ts:#aab3c2; --tm:#7d8697;
      --bd:#2e3644; --bds:#3d4657;
      --acc:#7aa5f8; --acc-t:#a9c4fa; --acc-bg:#1d2c47;
      --ok-t:#7fd8b8; --ok-bg:#123a30;
      --warn-t:#efb86a; --warn-bg:#3c2a11;
      --dang-t:#f0a0a0; --dang-bg:#3e1d1d;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--s0);color:var(--tp);font-family:var(--sans);line-height:1.8;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1020px;margin:0 auto;padding:0 22px}

  .ptabs{background:var(--s2);border-bottom:1px solid var(--bd)}
  .ptabs-in{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
  .pbrand{font-size:.8rem;font-weight:800;color:var(--ts);letter-spacing:.06em;margin-right:auto}
  .ptabs nav{display:flex;gap:6px;flex-wrap:wrap;row-gap:4px;max-width:100%}
  .ptabs nav a{white-space:nowrap;font-size:.8rem;font-weight:500;color:var(--ts);padding:6px 13px;border-radius:30px;border:1px solid transparent}
  .ptabs nav a:hover{color:var(--acc-t);background:var(--acc-bg)}
  .ptabs nav a.on{background:var(--acc);color:#fff}
  /* UX013: ダークの「--acc(#7aa5f8) 地 × 白文字」は 2.452:1 で AA 未達。
     ハンドブック側と同じアウトライン表示に揃える（--acc-t は既存トークン。--s2 上 8.408:1） */
  @media (prefers-color-scheme: dark){
    .ptabs nav a.on{background:transparent;color:var(--acc-t);border-color:var(--acc-t)}
  }
  @media(max-width:560px){.ptabs-in{justify-content:center}.pbrand{width:100%;text-align:center;margin-right:0}}

  header.top{background:var(--s2);border-bottom:1px solid var(--bd);padding:26px 0 20px}
  .brand{font-size:1.7rem;font-weight:700;margin:0;letter-spacing:.03em}
  .sub{font-size:.84rem;color:var(--ts);margin-top:5px}

  .cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:24px 0 0}
  /* UX021: 余白を既存の4px刻みへ（14px→16px / 10px→12px）。タップ領域44px・1カラム折り返しは既に充足 */
  .cat{display:flex;flex-direction:column;text-align:left;font:inherit;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:16px;cursor:pointer;color:var(--tp);min-height:44px}
  .cat:hover{border-color:var(--acc);background:var(--acc-bg)}
  .cat:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .cat .n{font-size:.96rem;font-weight:700;line-height:1.5}
  .cat .d{font-size:.78rem;color:var(--ts);line-height:1.7;margin-top:4px;flex:1}
  .cat .m{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:.72rem;color:var(--tm)}
  .cat .best{color:var(--ok-t);background:var(--ok-bg);border-radius:20px;padding:1px 9px;font-weight:700}

  .card{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:24px 24px 20px;margin:24px 0 0}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.74rem;color:var(--tm)}
  .tag{display:inline-block;font-size:.72rem;font-weight:500;padding:2px 10px;border-radius:30px;background:var(--s1);color:var(--ts)}
  .track{flex:1;min-width:80px;height:6px;background:var(--s1);border-radius:6px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--acc);border-radius:6px}
  .qtxt{font-size:1.08rem;font-weight:700;line-height:1.7;margin:12px 0 0}

  .opts{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:44px;text-align:left;font:inherit;font-size:.94rem;line-height:1.65;color:var(--tp);background:var(--s2);border:1px solid var(--bds);border-radius:var(--radius);padding:12px 16px;cursor:pointer}
  .opt:hover:not(:disabled){border-color:var(--acc);background:var(--acc-bg)}
  .opt:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .opt:disabled{cursor:default}
  .opt .mk{flex:none;width:24px;height:24px;border-radius:50%;background:var(--s1);color:var(--ts);font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt.correct{border-color:var(--ok-t);background:var(--ok-bg)}
  .opt.correct .mk{background:var(--ok-t);color:var(--s2)}
  .opt.wrong{border-color:var(--dang-t);background:var(--dang-bg)}
  .opt.wrong .mk{background:var(--dang-t);color:var(--s2)}
  .opt.dim{opacity:.62}

  .verdict{display:inline-block;font-size:.86rem;font-weight:700;padding:4px 12px;border-radius:30px;margin:16px 0 0}
  .verdict.ok{background:var(--ok-bg);color:var(--ok-t)}
  .verdict.ng{background:var(--dang-bg);color:var(--dang-t)}
  .exp{font-size:.9rem;color:var(--tp);background:var(--s1);border-radius:12px;padding:16px;margin:12px 0 0}
  .exp .lb{display:block;font-size:.74rem;font-weight:700;color:var(--ts);letter-spacing:.04em;margin-bottom:4px}
  .refl{display:inline-flex;align-items:center;gap:8px;margin:16px 0 0;font-size:.9rem;font-weight:500;color:var(--acc-t);border:1px solid var(--bds);border-radius:30px;padding:10px 16px;min-height:44px}
  .refl:hover{background:var(--acc-bg);border-color:var(--acc)}

  .acts{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 0}
  .btn{font:inherit;font-size:.84rem;font-weight:500;color:var(--ts);background:var(--s2);border:1px solid var(--bds);border-radius:30px;padding:9px 16px;min-height:44px;cursor:pointer}
  .btn:hover{color:var(--acc-t);border-color:var(--acc);background:var(--acc-bg)}
  .btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .btn.pri{color:var(--acc-t);border-color:var(--acc);background:var(--acc-bg);font-weight:700}

  .score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .score .n{font-size:2.4rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
  .score .n small{font-size:1rem;font-weight:400;color:var(--ts)}
  .score .cm{font-size:.86rem;color:var(--ts)}
  .rev{margin:20px 0 0}
  .rev-i{border-top:1px solid var(--bd);padding:14px 0}
  .rev-i:first-child{border-top:none}
  .rev-i .h{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;font-weight:700;line-height:1.6}
  .rev-i .mk{flex:none;font-size:.74rem;font-weight:700;border-radius:20px;padding:1px 9px;margin-top:3px}
  .rev-i .mk.ok{background:var(--ok-bg);color:var(--ok-t)}
  .rev-i .mk.ng{background:var(--dang-bg);color:var(--dang-t)}
  .rev-i .ans{font-size:.84rem;color:var(--ts);margin-top:6px}
  .rev-i .ans b{color:var(--tp)}
  .rev-i .ex{font-size:.82rem;color:var(--ts);line-height:1.8;margin-top:6px}
  .rev-i a{display:inline-block;font-size:.8rem;font-weight:500;color:var(--acc-t);margin-top:6px}
  .rev-i a:hover{text-decoration:underline}

  .note{font-size:.78rem;color:var(--ts);background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:24px 0 0}
  .note b{color:var(--tp)}
  .empty{color:var(--ts);font-size:.88rem;padding:24px 4px}
  footer{margin:32px 0 40px;font-size:.74rem;color:var(--tm);text-align:center}

  @media(max-width:560px){.cats{grid-template-columns:1fr}.card{padding:18px 16px}}
  @media print{
    .ptabs,.acts,.note,footer,.opts{display:none!important}
    body{background:#fff;color:#000}
    .card{border:1px solid #999;break-inside:avoid}
  }
</style>
</head>
<body>
<div class="ptabs"><div class="wrap ptabs-in"><span class="pbrand">ものづくりポータル</span><nav aria-label="サイト内ページ"><a href="./">📊 今日の情報</a><a href="handbook/">📘 ハンドブック</a><a href="calendar.html">📅 品質カレンダー</a><a class="on" aria-current="page" href="quiz.html">🧠 理解度クイズ</a><a href="trends.html">📈 指標の推移</a><a href="soudan.html">💬 セルフ診断</a></nav></div></div>

<header class="top"><div class="wrap">
  <h1 class="brand">理解度クイズ</h1>
  <div class="sub">ものづくりハンドブックの内容から、カテゴリごとに10問。1問ずつ答え合わせをして、最後に結果と解説をまとめて見られます。</div>
</div></header>

<main class="wrap">
  <div id="main"><div class="empty" id="loading">読み込み中…</div></div>
  <div class="note">出題はハンドブックの記述にもとづく理解確認です。社内の正式な様式・数値・権限は各ページの【要確認】に従ってください。<b>回答と記録はこの端末内（ブラウザ）にだけ保存され、どこにも送信されません。</b>個人情報の入力欄はありません。</div>
</main>

<footer>ものづくりポータル｜理解度クイズ（旧「クイズ」・出題データ: quiz-data.json）</footer>

<script>
(function(){
  "use strict";
  var KEY="portal-quiz-v2";
  var data=null, cat=null, set=[], idx=0, answers=[];
  var main=document.getElementById("main");

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
  function load(){ try{var s=localStorage.getItem(KEY); return s?JSON.parse(s):{};}catch(e){return {};} }
  function save(st){ try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){} }

  function shuffle(a){
    var r=a.slice();
    for (var i=r.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=r[i]; r[i]=r[j]; r[j]=t; }
    return r;
  }
  function catById(id){
    for (var i=0;i<data.categories.length;i++){ if (data.categories[i].id===id) return data.categories[i]; }
    return null;
  }
  function poolOf(id){
    return data.questions.filter(function(q){ return q.cat===id; });
  }

  /* ---------- カテゴリ選択 ---------- */
  function renderCats(){
    var st=load();
    var h='<div class="cats">';
    data.categories.forEach(function(c){
      var pool=poolOf(c.id);
      if (!pool.length) return;
      var rec=st[c.id]||{};
      var best=(typeof rec.best==="number") ? '<span class="best">最高 '+rec.best+' / 10</span>' : '';
      var last=rec.last ? '<span>前回 '+esc(rec.last)+'</span>' : '<span>未挑戦</span>';
      h+='<button class="cat" type="button" data-cat="'+esc(c.id)+'">'+
         '<span class="n">'+esc(c.name)+'</span>'+
         '<span class="d">'+esc(c.desc)+'</span>'+
         '<span class="m"><span>'+Math.min(10,pool.length)+'問</span>'+best+last+'</span></button>';
    });
    h+='</div>';
    main.innerHTML=h;
    var btns=main.querySelectorAll(".cat");
    for (var i=0;i<btns.length;i++){
      btns[i].addEventListener("click", function(){ start(this.getAttribute("data-cat")); });
    }
  }

  /* ---------- 出題 ---------- */
  function start(id){
    cat=catById(id);
    set=shuffle(poolOf(id)).slice(0,10);
    idx=0; answers=[];
    renderQ();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderQ(){
    var q=set[idx];
    var pct=Math.round(idx/set.length*100);
    var h='<div class="card"><div class="meta"><span class="tag">'+esc(cat.name)+'</span>'+
          '<span>'+(idx+1)+' / '+set.length+' 問</span>'+
          '<span class="track"><i style="width:'+pct+'%"></i></span></div>'+
          '<p class="qtxt">'+esc(q.q)+'</p><ul class="opts" id="opts">';
    var mk=["A","B","C"];
    q.c.forEach(function(c,i){
      h+='<li><button class="opt" type="button" data-i="'+i+'"><span class="mk">'+mk[i]+'</span><span>'+esc(c)+'</span></button></li>';
    });
    h+='</ul><div id="after"></div></div>'+
       '<div class="acts"><button class="btn" type="button" id="btnQuit">カテゴリ一覧へ戻る</button></div>';
    main.innerHTML=h;
    var opts=main.querySelectorAll(".opt");
    for (var i=0;i<opts.length;i++){
      opts[i].addEventListener("click", function(){ answer(parseInt(this.getAttribute("data-i"),10)); });
    }
    document.getElementById("btnQuit").addEventListener("click", function(){ renderCats(); window.scrollTo({top:0,behavior:"smooth"}); });
  }

  function answer(pick){
    var q=set[idx];
    var ok=(pick===q.a);
    answers.push({id:q.id, pick:pick, ok:ok});
    var opts=main.querySelectorAll(".opt");
    for (var i=0;i<opts.length;i++){
      opts[i].disabled=true;
      if (i===q.a) opts[i].classList.add("correct");
      else if (i===pick) opts[i].classList.add("wrong");
      else opts[i].classList.add("dim");
    }
    var last=(idx===set.length-1);
    var h='<div class="verdict '+(ok?"ok":"ng")+'">'+(ok?"正解":"不正解")+'</div>'+
          '<div class="exp"><span class="lb">解説</span>'+esc(q.exp)+'</div>'+
          '<a class="refl" href="'+esc(q.ref.u)+'">📘 '+esc(q.ref.t)+' を読む</a>'+
          '<div class="acts"><button class="btn pri" type="button" id="btnNext">'+(last?"結果を見る":"次の問題へ")+'</button></div>';
    document.getElementById("after").innerHTML=h;
    document.getElementById("btnNext").addEventListener("click", function(){
      if (last){ finish(); } else { idx++; renderQ(); }
      window.scrollTo({top:0,behavior:"smooth"});
    });
  }

  /* ---------- 結果 ---------- */
  function finish(){
    var n=0;
    answers.forEach(function(a){ if (a.ok) n++; });
    var st=load();
    var rec=st[cat.id]||{};
    rec.best=Math.max(rec.best||0, n);
    rec.last=ymd(new Date());
    rec.plays=(rec.plays||0)+1;
    st[cat.id]=rec; save(st);

    var cm = n===set.length ? "全問正解です。" :
             (n>=Math.ceil(set.length*0.8) ? "よく押さえられています。間違えた問題だけ読み直しておきましょう。" :
             (n>=Math.ceil(set.length*0.5) ? "半分以上は正解です。間違えた問題のページを読み直すと定着します。" :
              "間違えた問題の解説とリンク先を、ひとつずつ確認してみてください。"));
    var h='<div class="card"><div class="meta"><span class="tag">'+esc(cat.name)+'</span><span>結果</span></div>'+
          '<div class="score" style="margin-top:12px"><span class="n">'+n+'<small> / '+set.length+' 問正解</small></span>'+
          '<span class="cm">'+esc(cm)+'</span></div>'+
          '<div class="rev">';
    set.forEach(function(q,i){
      var a=answers[i];
      h+='<div class="rev-i"><div class="h"><span class="mk '+(a.ok?"ok":"ng")+'">'+(a.ok?"正解":"不正解")+'</span>'+
         '<span>'+(i+1)+'. '+esc(q.q)+'</span></div>';
      if (!a.ok){
        h+='<div class="ans">あなたの回答：'+esc(q.c[a.pick])+'<br>正解：<b>'+esc(q.c[q.a])+'</b></div>';
      } else {
        h+='<div class="ans">正解：<b>'+esc(q.c[q.a])+'</b></div>';
      }
      h+='<div class="ex">'+esc(q.exp)+'</div>'+
         '<a href="'+esc(q.ref.u)+'">📘 '+esc(q.ref.t)+' を読む</a></div>';
    });
    h+='</div></div>'+
       '<div class="acts"><button class="btn pri" type="button" id="btnAgain">同じカテゴリをもう一度</button>'+
       '<button class="btn" type="button" id="btnBack">カテゴリ一覧へ戻る</button>'+
       '<button class="btn" type="button" id="btnClear">記録をクリア</button></div>';
    main.innerHTML=h;
    document.getElementById("btnAgain").addEventListener("click", function(){ start(cat.id); });
    document.getElementById("btnBack").addEventListener("click", function(){ renderCats(); window.scrollTo({top:0,behavior:"smooth"}); });
    document.getElementById("btnClear").addEventListener("click", function(){
      if (!window.confirm("この端末に保存した最高得点などの記録を消します。よろしいですか？")) return;
      try{ localStorage.removeItem(KEY); }catch(e){}
      renderCats(); window.scrollTo({top:0,behavior:"smooth"});
    });
  }

  /* ---------- 読み込み ---------- */
  function boot(d){
    data=d;
    if (!data || !data.categories || !data.questions){ main.innerHTML='<div class="empty">出題データを読み込めませんでした。</div>'; return; }
    renderCats();
  }

  fetch("quiz-data.json",{cache:"no-cache"})
    .then(function(r){ if(!r.ok) throw new Error("load"); return r.json(); })
    .then(boot)
    .catch(function(){ main.innerHTML='<div class="empty">出題データを読み込めませんでした。時間をおいて開き直してください。</div>'; });
})();
</script>
</body>
</html>
